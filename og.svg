<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="links" width="80" height="80" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="40" height="80" fill="#d3141b"/><rect x="40" width="40" height="80" fill="#fff"/>
    </pattern>
    <pattern id="rechts" width="80" height="80" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <rect width="40" height="80" fill="#d3141b"/><rect x="40" width="40" height="80" fill="#fff"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#0b2447"/>
  <text x="80" y="300" fill="#fff" font-family="Bahnschrift, 'DIN Alternate', 'Roboto Condensed', system-ui, sans-serif" font-weight="700" font-size="170" letter-spacing="-3">einsatz.tools</text>
  <text x="84" y="380" fill="#fff" font-family="system-ui, sans-serif" font-size="38">Werkzeuge für BOS und Hilfsorganisationen.</text>
  <text x="84" y="432" fill="#fff" font-family="system-ui, sans-serif" font-size="38">Im Browser, ohne Konto, kostenlos.</text>
  <rect x="0" y="540" width="600" height="90" fill="url(#links)"/>
  <rect x="600" y="540" width="600" height="90" fill="url(#rechts)"/>
</svg>
